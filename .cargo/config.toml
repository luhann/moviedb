[build]
target = "x86_64-unknown-linux-musl"

# sqlite3.c is compiled with the host's clang and glibc headers, since
# there's no musl sysroot installed. With large-file support on, glibc
# renames lstat/open/mmap to *64 versions that musl doesn't have. Turning it
# off changes nothing on x86_64, where off_t is 64-bit anyway.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DISABLE_LFS"

# The workstation's Gentoo profile sets CFLAGS="-march=native ...". cc-rs
# would use that for sqlite3.c and mimalloc and put Zen 3 instructions into a
# binary that runs on Intel. force = true overrides whatever is in the
# environment. See also the target-cpu note below.
CFLAGS = { value = "-O2", force = true }
CXXFLAGS = { value = "-O2", force = true }

# Link the C runtime statically. That's the default for musl as of
# 2026-06-01, but the default is planned to change to dynamic linking. The
# binary has to be fully static because the systemd units only allow
# executing the binary itself (ExecPaths), which rules out a dynamic loader.
#
# See: https://github.com/rust-lang/compiler-team/issues/422
# See: https://github.com/rust-lang/compiler-team/issues/422#issuecomment-812135847
[target.x86_64-unknown-linux-musl]
linker = "clang"

# target-cpu is pinned rather than native. The workstation is a Zen 3 Ryzen
# and the cluster is Intel, so a native build crashes with SIGILL on an
# AMD-only instruction (`extrq`, in hyper-util), i.e. on every OMDB request.
# x86-64-v3 runs on the oldest node, an i7-7700, so it works wherever the
# container is moved.
#
# A RUSTFLAGS environment variable replaces this whole list, which is why
# scripts/deploy.sh unsets it.
rustflags = [
  "-Z", "threads=8",
  "-C", "target-cpu=x86-64-v3",
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
]
